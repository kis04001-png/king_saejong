<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5e8c8">
  <title>세종대왕의 답장</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="seal">훈민정음</div>
      <p class="eyebrow">우리 반 역사·상상 활동</p>
      <h1>세종대왕의 답장</h1>
      <p>활동지를 찍어 올리면, 세종대왕님이 답장을 보내 주십니다.</p>
    </header>

    <section class="panel">
      <h2>1. 활동지 올리기</h2>
      <label class="field">이름 또는 별명 <input id="studentName" maxlength="20" placeholder="예: 3번 홍길동"></label>
      <div class="actions">
        <label class="upload-btn" for="cameraInput">📷 카메라로 촬영</label>
        <label class="upload-btn secondary" for="fileInput">🖼️ 사진 업로드</label>
      </div>
      <input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment">
      <input id="fileInput" class="hidden" type="file" accept="image/*">
      <div id="previewWrap" class="preview-wrap hidden">
        <img id="preview" alt="업로드할 활동지 미리보기">
        <button id="removeImage" class="text-button" type="button">사진 다시 선택</button>
      </div>
      <p class="hint">활동지 전체가 나오도록 밝은 곳에서 촬영해 주세요. 글씨가 잘 보이면 답장이 더 정확해집니다.</p>
      <label class="consent"><input id="consent" type="checkbox"> 선생님이 학습 확인을 위해 이 사진과 답장을 볼 수 있다는 것을 확인했어요.</label>
      <button id="sendBtn" class="primary" type="button" disabled>세종대왕님께 편지 보내기</button>
      <p id="status" class="status" role="status"></p>
    </section>

    <section id="replyPanel" class="panel reply hidden" aria-live="polite">
      <div class="reply-head"><span>👑</span><div><p class="eyebrow">임금님의 답장</p><h2>세종대왕</h2></div></div>
      <div id="replyText" class="reply-text"></div>
      <p class="hint">※ 인공지능이 활동지의 글씨를 읽어 만든 답장입니다. 글씨를 잘못 읽었을 수 있어요.</p>
    </section>

    <footer>우리의 생각을 소중히 기록해요 · 학급 활동용</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
