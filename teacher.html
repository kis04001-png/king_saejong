<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사용 활동지 모아보기</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><header class="hero"><p class="eyebrow">TEACHER VIEW</p><h1>우리 반 활동지</h1><p>학생들의 사진과 세종대왕 답장을 확인합니다.</p></header>
<section class="panel" id="loginPanel"><h2>교사 로그인</h2><label class="field">교사 이메일<input id="email" type="email" autocomplete="username"></label><label class="field" style="margin-top:12px">비밀번호<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="login" style="margin-top:16px">로그인</button><p class="status" id="loginStatus"></p></section>
<section class="panel hidden" id="listPanel"><div class="dashboard-head"><h2>제출 목록</h2><button id="logout" class="text-button">로그아웃</button></div><label class="field">학생 이름 또는 번호 검색<input id="search" type="search" placeholder="예: 3번, 홍길동"></label><div class="dashboard-actions"><button class="upload-btn" id="refresh">새로고침</button><span id="count" class="hint"></span></div><div id="submissions"></div><p class="status" id="listStatus"></p></section>
<footer>학생 사진은 학습 확인 목적으로만 열람해 주세요.</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="teacher.js"></script></body></html>
